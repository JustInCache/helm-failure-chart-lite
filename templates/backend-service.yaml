# =============================================================
# SCENARIO 3: Service has 0 endpoints
# Deployment labels pods with "app: backend"
# But this Service selector looks for "app: backend-api"
# Mismatch → Service discovers 0 matching pods → 0 endpoints
# FIX: Change selector from "app: backend-api" to "app: backend"
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hfc-lite.fullname" . }}-backend

  labels:
    {{- include "hfc-lite.labels" . | nindent 4 }}
    app: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # BUG: selector "backend-api" doesn't match pod label "backend"
  selector:
    app: backend-api
